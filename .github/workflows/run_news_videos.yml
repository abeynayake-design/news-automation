name: Run News Video Automation

on:
  schedule:
    # Runs automatically every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger button in Actions tab

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser google-genai

      - name: Run News Video Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python video_news_slider.py

      - name: Commit History Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add published_video_history.txt || true
          git commit -m "Update video publication history [skip ci]" || true
          git push
